name: Goleszan test Pages release
run-name: ${{ github.ref_name }}
on:
  push:
    tags:
      - 'g19-release-*-api'
      - 'g19-release-*-preview'
      - 'g19-release-*-functional'
      - 'g19-release-*-production'
      - 'g19-release-*-post'

permissions: {}
concurrency:
  group: goleszan-19-preview-pages-release
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'Axylion/sprzatanie-mieszkania' &&
      github.actor == 'Axylion' &&
      github.event.created && !github.event.deleted && !github.event.forced &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/g19-release/release.py authorize

  build:
    needs: authorize
    if: needs.authorize.outputs.stage == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          path: release-source
          persist-credentials: false
      - run: python3 release-control/scripts/g19-release/release.py package release-source candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g19-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  release:
    needs: [authorize, build]
    if: >-
      always() && !cancelled() && needs.authorize.result == 'success' &&
      ((needs.authorize.outputs.stage == 'preview' && needs.build.result == 'success') ||
       (needs.authorize.outputs.stage != 'preview' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - if: needs.authorize.outputs.stage == 'preview' || needs.authorize.outputs.stage == 'production'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - if: needs.authorize.outputs.stage == 'preview' || needs.authorize.outputs.stage == 'production'
        run: npm ci --prefix scripts/g19-release --ignore-scripts --no-audit --no-fund
      - name: Execute authorized stage
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 scripts/g19-release/release.py execute
      - name: Preserve stage record
        if: always() && steps.execute.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g19-stage
          path: stage-record/
          if-no-files-found: warn
          retention-days: 90
