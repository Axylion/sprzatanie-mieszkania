name: Goleszan permanent test Pages release
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - release/goleszan-permanent-test

permissions: {}
concurrency:
  group: goleszan-19-permanent-test-pages
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      github.repository == 'Axylion/sprzatanie-mieszkania' &&
      github.actor == 'Axylion' &&
      !github.event.deleted && !github.event.forced &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'release: publish ')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/g19-release/release.py authorize

  build:
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: release-control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Test release controls
        run: python3 release-control/scripts/g19-release/test_release.py
      - name: Build exact application source
        run: python3 release-control/scripts/g19-release/release.py package release-source candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g19-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [authorize, build]
    if: needs.authorize.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - run: npm ci --prefix scripts/g19-release --ignore-scripts --no-audit --no-fund
      - name: Publish to the one permanent URL
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 scripts/g19-release/release.py execute
      - name: Preserve release audit
        if: always() && steps.execute.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g19-stage
          path: stage-record/
          if-no-files-found: warn
          retention-days: 90
